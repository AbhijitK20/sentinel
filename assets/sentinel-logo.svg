<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>
  
  <!-- Shield -->
  <path d="M60 8 L108 32 L108 72 C108 95 60 116 60 116 C60 116 12 95 12 72 L12 32 Z" 
        fill="url(#shieldGrad)" opacity="0.95"/>
  
  <!-- Shield inner glow -->
  <path d="M60 16 L100 36 L100 70 C100 88 60 106 60 106 C60 106 20 88 20 70 L20 36 Z" 
        fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- Magnifying glass circle -->
  <circle cx="52" cy="52" r="20" fill="none" stroke="white" stroke-width="4" opacity="0.95"/>
  
  <!-- Magnifying glass handle -->
  <line x1="66" y1="66" x2="88" y2="88" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Checkmark (proof) -->
  <path d="M44 52 L50 58 L62 44" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Code brackets inside glass -->
  <text x="38" y="56" font-family="monospace" font-size="14" fill="white" opacity="0.4">&lt;/&gt;</text>
</svg>
