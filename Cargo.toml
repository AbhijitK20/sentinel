[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"
description = "Verify-first code review engine"

[lib]
name = "sentinel_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
pyo3-build-config = "0.29"
